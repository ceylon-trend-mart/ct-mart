<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ceylon Trend Mart | Admin</title>
<style>
body{margin:0;font-family:Arial;background:#f6f7fb;color:#111827}header{background:#111827;color:white;padding:18px;font-weight:bold}main{max-width:900px;margin:28px auto;padding:0 18px}.card{background:white;padding:24px;border-radius:18px;margin-bottom:20px;box-shadow:0 8px 30px #0001}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}textarea{min-height:90px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer;margin-top:14px}.save{background:#f59e0b}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#eef2ff}.msg{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#ecfdf5;color:#166534}.error{background:#fff1f2;color:#b42318}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee}.login{max-width:420px;margin:60px auto}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body>
<header>CEYLON TREND MART — TRACKING ADMIN</header><main>
<div id="login" class="card login"><h1>Admin Login</h1>
<label>Email</label><input id="email" type="email">
<label>Password</label><input id="password" type="password">
<button id="loginBtn" class="save">LOGIN</button><div id="loginMsg" class="msg"></div></div>
<div id="panel" class="hidden">
<div class="card"><h1>Tracking Management</h1><button id="logout" class="secondary">LOG OUT</button>
<div class="row"><div><label>Tracking Number *</label><input id="number" placeholder="CTM100001"></div><div><label>Customer Name</label><input id="customer"></div></div>
<div class="row"><div><label>Courier</label><input id="courier" value="Sri Lanka Post"></div><div><label>Status</label><select id="status"><option>Order Received</option><option>Processing</option><option>Dispatched</option><option>In Transit</option><option>Out for Delivery</option><option>Delivered</option></select></div></div>
<label>Last Updated</label><input id="updated" placeholder="05 Oct 2026, 5:00 PM">
<label>Status History (Status | Date/Time)</label><textarea id="history"></textarea>
<button id="save" class="save">SAVE / UPDATE</button><button id="clear" class="danger">CLEAR</button><div id="msg" class="msg"></div></div>
<div class="card"><h2>Saved Tracking Numbers</h2><div id="list">Loading...</div></div>
</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,getDoc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBf0mwsWH3x-6zssLeUpb8xyNGK80dZ17c",authDomain:"ceylon-trend-mart.firebaseapp.com",projectId:"ceylon-trend-mart",storageBucket:"ceylon-trend-mart.firebasestorage.app",messagingSenderId:"138243699637",appId:"1:138243699637:web:b47a3bcf37d0b5cac39ffc"};
const ADMIN_UID="vCNIUIUzGWNXaUIATdYIDJkeGLJ3";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function notice(t,e=false){let x=$("msg");x.textContent=t;x.className="msg"+(e?" error":"");x.style.display="block";setTimeout(()=>x.style.display="none",3000)}
function loginNotice(t){let x=$("loginMsg");x.textContent=t;x.className="msg error";x.style.display="block"}
async function load(){try{let s=await getDocs(collection(db,"tracking")),a=[];s.forEach(x=>a.push([x.id,x.data()]));a.sort();$("list").innerHTML=a.length?`<table><tr><th>Tracking</th><th>Status</th><th>Customer</th><th>Action</th></tr>${a.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1].status)}</td><td>${esc(x[1].customerName)}</td><td><button onclick="window.editRecord('${esc(x[0])}')">Edit</button> <button class="danger" onclick="window.deleteRecord('${esc(x[0])}')">Delete</button></td></tr>`).join("")}</table>`:"No tracking numbers saved yet."}catch(e){$("list").textContent="Could not load tracking records. Check Firestore Rules.";console.error(e)}}
window.editRecord=async id=>{let s=await getDoc(doc(db,"tracking",id));if(!s.exists())return;let d=s.data();$("number").value=id;$("customer").value=d.customerName||"";$("courier").value=d.courier||"Sri Lanka Post";$("status").value=d.status||"Order Received";$("updated").value=d.updated||"";$("history").value=(d.events||[]).map(x=>`${x.title||""} | ${x.time||""}`).join("\n");scrollTo(0,0)};
window.deleteRecord=async id=>{if(confirm("Delete "+id+"?")){await deleteDoc(doc(db,"tracking",id));load()}};
$("loginBtn").onclick=async()=>{let e=$("email").value.trim(),p=$("password").value;if(!e||!p)return loginNotice("Enter your email and password.");$("loginBtn").disabled=true;try{let c=await signInWithEmailAndPassword(auth,e,p);if(c.user.uid!==ADMIN_UID){await signOut(auth);loginNotice("This account is not authorized as the admin.");}}catch(x){loginNotice("Login failed. Check your email and password.");console.error(x)}finally{$("loginBtn").disabled=false}};
$("logout").onclick=()=>signOut(auth);
$("clear").onclick=()=>["number","customer","updated","history"].forEach(x=>$(x).value="");
$("save").onclick=async()=>{if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID)return notice("Not authorized.",true);let id=$("number").value.trim().toUpperCase();if(!id)return notice("Enter a tracking number.",true);let lines=$("history").value.split("\n").map(x=>x.trim()).filter(Boolean),events=lines.map((x,i)=>{let p=x.split("|");return{title:(p[0]||"").trim(),time:p.slice(1).join("|").trim(),done:i<lines.length-1}});try{await setDoc(doc(db,"tracking",id),{customerName:$("customer").value.trim(),courier:$("courier").value.trim(),status:$("status").value,updated:$("updated").value.trim(),events,updatedAt:new Date().toISOString()});notice("Tracking saved successfully.");load()}catch(e){console.error(e);notice("Save failed. Check Firestore Rules.",true)}};
onAuthStateChanged(auth,u=>{if(u&&u.uid===ADMIN_UID){$("login").classList.add("hidden");$("panel").classList.remove("hidden");load()}else{$("panel").classList.add("hidden");$("login").classList.remove("hidden")}});
</script></body></html>
