<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ceylon Trend Mart | Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb;color:#111827}header{background:#111827;color:#fff;padding:18px 20px}.brand{font-size:21px;font-weight:800}main{max-width:980px;margin:28px auto;padding:0 18px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 30px #0001;margin-bottom:20px}.login{max-width:430px;margin:60px auto}.hidden{display:none}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;font:inherit}textarea{min-height:130px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer;margin-top:15px}.primary{background:#f59e0b}.secondary{background:#eef2ff}.danger{background:#fee2e2;color:#991b1b}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;display:none}.error{background:#fff7ed;color:#9a3412}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.small{padding:7px 10px;margin:0;font-size:12px}.muted{color:#6b7280;font-size:13px}@media(max-width:700px){.row{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><header><div class="brand">CEYLON TREND MART — TRACKING ADMIN</div></header><main>
<div id="login" class="card login"><h1>Admin Login</h1><p class="muted">Use the Firebase admin account you created.</p><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><button id="loginBtn" class="primary">LOGIN</button><div id="loginMsg" class="msg"></div></div>
<div id="panel" class="hidden"><div class="card"><div class="toolbar"><div><h1>Tracking Management</h1><p class="muted">Only the authenticated admin can save records.</p></div><button id="logout" class="secondary">LOG OUT</button></div>
<div class="row"><div><label>Tracking Number *</label><input id="tn" placeholder="CTM123456"></div><div><label>Customer Name</label><input id="cn" placeholder="First name or short name"></div></div>
<div class="row"><div><label>Courier</label><input id="co" value="Sri Lanka Post"></div><div><label>Current Status</label><select id="st"><option>Order Received</option><option>Processing</option><option>Dispatched</option><option>In Transit</option><option>Out for Delivery</option><option>Delivered</option></select></div></div>
<label>Last Updated</label><input id="up" placeholder="02 Oct 2026, 6:00 PM"><label>Status History <span class="muted">(Status | Date/Time, one per line)</span></label><textarea id="hist" placeholder="Order Received | 02 Oct 2026, 9:00 AM&#10;Processing | 02 Oct 2026, 11:00 AM&#10;In Transit | 02 Oct 2026, 6:00 PM"></textarea>
<button id="save" class="primary">SAVE / UPDATE</button><button id="clear" class="secondary">CLEAR</button><div id="saveMsg" class="msg"></div></div>
<div class="card"><div class="toolbar"><div><h2>Saved Tracking Numbers</h2><div class="muted">The list is visible only after admin login.</div></div><button id="refresh" class="secondary">REFRESH</button></div><div id="list" class="muted">Loading...</div></div></div></main>
<script type="module">
import{auth,db}from"./firebase-config.js";import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{collection,doc,getDoc,getDocs,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const UID="vCNIUIUzGWNXaUIATdYIDJkeGLJ3", $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function msg(t,e=false){$("saveMsg").textContent=t;$("saveMsg").className="msg"+(e?" error":"");$("saveMsg").style.display="block";setTimeout(()=>$("saveMsg").style.display="none",2500)}
function clear(){["tn","cn","up","hist"].forEach(x=>$(x).value="");$("co").value="Sri Lanka Post";$("st").value="Order Received"}
async function list(){let el=$("list");el.textContent="Loading...";try{let s=await getDocs(collection(db,"tracking"));if(s.empty){el.textContent="No tracking numbers yet.";return}let a=[];s.forEach(x=>a.push({id:x.id,d:x.data()}));a.sort((x,y)=>x.id.localeCompare(y.id));el.innerHTML=`<table><tr><th>Tracking</th><th>Status</th><th>Customer</th><th>Updated</th><th>Action</th></tr>${a.map(x=>`<tr><td><b>${esc(x.id)}</b></td><td>${esc(x.d.status)}</td><td>${esc(x.d.customerName)}</td><td>${esc(x.d.updated)}</td><td><button class="small secondary" data-e="${esc(x.id)}">Edit</button> <button class="small danger" data-d="${esc(x.id)}">Delete</button></td></tr>`).join("")}</table>`;document.querySelectorAll("[data-e]").forEach(b=>b.onclick=async()=>{let id=b.dataset.e,s=await getDoc(doc(db,"tracking",id));if(s.exists()){let d=s.data();$("tn").value=id;$("cn").value=d.customerName||"";$("co").value=d.courier||"Sri Lanka Post";$("st").value=d.status||"Order Received";$("up").value=d.updated||"";$("hist").value=(d.events||[]).map(x=>`${x.title} | ${x.time||""}`).join("\n");scrollTo({top:0,behavior:"smooth"})}});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("Delete "+b.dataset.d+"?")){await deleteDoc(doc(db,"tracking",b.dataset.d));msg("Deleted.");list()}})}catch(e){console.error(e);el.textContent="Could not load records. Check Firestore Rules."}}
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){$("loginMsg").textContent="Login failed. Check your email and password.";$("loginMsg").className="msg error";$("loginMsg").style.display="block"}};
$("logout").onclick=()=>signOut(auth);$("clear").onclick=clear;$("refresh").onclick=list;
$("save").onclick=async()=>{let id=$("tn").value.trim().toUpperCase();if(!id){msg("Enter a tracking number.",true);return}if(!auth.currentUser||auth.currentUser.uid!==UID){msg("Not authorized.",true);return}let lines=$("hist").value.split("\n").map(x=>x.trim()).filter(Boolean),events=lines.map((x,i)=>{let p=x.split("|");return{title:(p[0]||"").trim(),time:p.slice(1).join("|").trim(),done:i<lines.length-1}});try{await setDoc(doc(db,"tracking",id),{customerName:$("cn").value.trim(),courier:$("co").value.trim(),status:$("st").value,updated:$("up").value.trim(),events,updatedAt:new Date().toISOString()});msg("Tracking saved successfully.");list()}catch(e){console.error(e);msg("Save failed. Check your Firestore rules.",true)}};
onAuthStateChanged(auth,u=>{if(u&&u.uid===UID){$("login").classList.add("hidden");$("panel").classList.remove("hidden");list()}else{$("panel").classList.add("hidden");$("login").classList.remove("hidden");if(u)signOut(auth)}});
</script></body></html>
