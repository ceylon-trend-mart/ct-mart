<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ceylon Trend Mart | Track Order</title>
<style>
:root{--primary:#111827;--accent:#f59e0b;--bg:#f6f7fb;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#111827}
header{background:var(--primary);color:#fff;padding:18px 20px;text-align:center}
.brand{font-size:22px;font-weight:800;letter-spacing:.3px}.tag{font-size:13px;color:#d1d5db;margin-top:4px}
main{max-width:720px;margin:38px auto;padding:0 18px}.hero{text-align:center;margin-bottom:22px}
.hero h1{font-size:34px;margin:0 0 8px}.hero p{color:var(--muted);margin:0}
.card{background:var(--card);border-radius:18px;padding:24px;box-shadow:0 8px 30px #11182710}
.search{display:flex;gap:10px;margin-top:22px}.search input{flex:1;border:1px solid var(--line);border-radius:12px;padding:15px;font-size:16px;outline:none}.search input:focus{border-color:var(--accent)}
button{border:0;border-radius:12px;background:var(--accent);color:#111827;font-weight:800;padding:0 22px;cursor:pointer;font-size:15px}
.result{margin-top:24px}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.tracking{font-weight:800;font-size:19px}.badge{background:#dcfce7;color:#166534;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.info div{background:#f9fafb;border-radius:12px;padding:13px}.label{font-size:12px;color:var(--muted)}.value{font-weight:700;margin-top:4px}
.timeline{position:relative;margin:24px 4px 8px}.step{display:flex;gap:14px;position:relative;padding-bottom:23px}.dot{width:18px;height:18px;border-radius:50%;border:3px solid #d1d5db;background:#fff;flex:0 0 18px;margin-top:2px;z-index:2}.step.done .dot{background:var(--green);border-color:var(--green)}.step.current .dot{background:var(--accent);border-color:var(--accent)}.step:not(:last-child):before{content:"";position:absolute;left:7px;top:19px;height:calc(100% - 4px);border-left:2px solid #e5e7eb}.step.done:not(:last-child):before{border-color:#86efac}.st-title{font-weight:800}.st-date{font-size:12px;color:var(--muted);margin-top:4px}
.error{margin-top:18px;background:#fff7ed;color:#9a3412;padding:14px;border-radius:12px;text-align:center;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px}
@media(max-width:600px){.search{flex-direction:column}.search button{height:50px}.hero h1{font-size:28px}.info{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand">CEYLON TREND MART</div><div class="tag">Order Tracking</div></header>
<main>
<section class="hero"><h1>Track Your Order</h1><p>Enter your tracking number to check the latest delivery status.</p></section>
<div class="card">
<div class="search"><input id="trackingInput" placeholder="e.g. CTM123456" autocomplete="off"><button onclick="trackOrder()">TRACK ORDER</button></div>
<div id="error" class="error hidden"></div>
<div id="result" class="result hidden"></div>
</div>
</main>
<footer>© Ceylon Trend Mart • Thank you for shopping with us.</footer>
<script>
const defaultData={
 "CTM123456":{customer:"Sample Customer",courier:"Sri Lanka Post",status:"In Transit",updated:"02 Oct 2026",events:[
  ["Order Received","01 Oct 2026, 9:10 AM",1],["Processing","01 Oct 2026, 11:30 AM",1],["Dispatched","01 Oct 2026, 4:15 PM",1],["In Transit","02 Oct 2026, 8:20 AM",0,"current"],["Out for Delivery","",0],["Delivered","",0]
 ]}
};
function data(){try{return JSON.parse(localStorage.getItem("ctm_tracking")||"null")||defaultData}catch(e){return defaultData}}
function trackOrder(){
 const key=document.getElementById("trackingInput").value.trim().toUpperCase(), d=data()[key], r=document.getElementById("result"), e=document.getElementById("error");
 e.classList.add("hidden");r.classList.add("hidden");
 if(!key){e.textContent="Please enter a tracking number.";e.classList.remove("hidden");return}
 if(!d){e.textContent="Tracking number not found. Please check the number and try again.";e.classList.remove("hidden");return}
 r.innerHTML=`<div class="top"><div><div class="label">Tracking Number</div><div class="tracking">${key}</div></div><div class="badge">${d.status}</div></div>
 <div class="info"><div><div class="label">Customer</div><div class="value">${esc(d.customer)}</div></div><div><div class="label">Courier</div><div class="value">${esc(d.courier)}</div></div><div><div class="label">Last Updated</div><div class="value">${esc(d.updated)}</div></div></div>
 <div class="timeline">${d.events.map(x=>`<div class="step ${x[2]?'done':''} ${x[3]||''}"><span class="dot"></span><div><div class="st-title">${esc(x[0])}</div><div class="st-date">${esc(x[1]||'Pending')}</div></div></div>`).join("")}</div>`;
 r.classList.remove("hidden")
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.getElementById("trackingInput").addEventListener("keydown",e=>{if(e.key==="Enter")trackOrder()});
</script>
</body></html>
